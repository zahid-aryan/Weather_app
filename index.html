<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./Css/all.css">
    <link rel="stylesheet" href="./Css/fontawesome.min.css">
    <link rel="stylesheet" href="./Css/style.css">
</head>

<body>
    <div class="card">
        <div class="search">
            <input type="search" placeholder="Enter city name...">
            <span id="search"><i class="fa-solid fa-magnifying-glass"></i></span>
        </div>
        <div class="weather">
            <div class="rain">
                <i id="rain" class="fa-solid fa-cloud-rain"></i>
            </div>
            <h1 class="temp">23°C</h1>
            <h2 class="city">Kandahar</h2>
            <div class="details">
                <div class="col">
                    <img src="./images/humidity.png" alt="Humidity image" class="Humidity">
                    <div>
                        <p class="hum">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <p class="wind"> <i class="fa-solid fa-wind"></i></p>
                    <div>
                        <p class="windd">15 km/h</p>
                        <p>Wind spead</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
